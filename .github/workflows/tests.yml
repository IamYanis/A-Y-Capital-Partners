name: Research checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --locked --extra dev --extra dashboard
      - run: uv run --locked --extra dashboard pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked aycapital-demo
      - run: uv run --locked aycapital-research --source synthetic --start 2018-01-01 --end 2024-01-01
      - run: uv run --locked aycapital-scenarios --source synthetic --start 2018-01-01 --end 2024-01-01 --output outputs/scenarios_synthetic
