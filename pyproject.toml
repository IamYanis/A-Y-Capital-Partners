[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aycapital"
version = "0.1.0"
description = "Reproducible quantitative investment research"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "cvxpy>=1.6,<2", "yfinance>=0.2.54,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
research = ["statsmodels>=0.14,<1", "plotly>=6,<7", "streamlit>=1.40,<2", "jupyterlab>=4,<5"]

[project.scripts]
aycapital-demo = "aycapital.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
